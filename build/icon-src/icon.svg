  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <g filter="url(#paneShadow)">
    <rect x="222" y="252" width="580" height="520" rx="84" fill="url(#pane)"/>
  </g>
  <rect x="222" y="252" width="580" height="520" rx="84" fill="url(#rim)"/>
  <path d="M340 470 L446 548 L340 626" fill="none" stroke="#F5F5F7" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
