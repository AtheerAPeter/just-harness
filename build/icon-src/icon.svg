<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Dark charcoal body, a touch lighter at the top like Apple's dark icons -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.5" stop-color="#1f1f22"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Brushed silver glyph -->
    <linearGradient id="silver" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e2e2e6"/>
      <stop offset="0.7" stop-color="#a9a9b0"/>
      <stop offset="1" stop-color="#d4d4d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g filter="url(#glyph)" fill="url(#silver)">
    <!-- chevron -->
    <path d="M300 358 Q300 330 326 318 Q352 306 376 322 L548 470 Q572 491 548 512 L376 660 Q352 676 326 664 Q300 652 300 624 Q300 606 316 592 L446 491 L316 390 Q300 376 300 358 Z"/>
    <!-- cursor -->
    <rect x="560" y="610" width="200" height="66" rx="33"/>
  </g>
</svg>
